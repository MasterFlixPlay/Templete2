<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="{{bg_color}}" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="{{app_name}}" />
<link rel="apple-touch-icon" href="https://i.ibb.co/7t6BpWkN/Canais.png" />
<title>{{app_name}} — Seu momento, seu mundo</title>
<link rel="manifest" href='data:application/manifest+json;charset=utf-8,{"name":"{{app_name}}","short_name":"App","start_url":".","display":"standalone","background_color":"{{bg_color}}","theme_color":"{{primary_color}}","icons":[{"src":"https://i.ibb.co/7t6BpWkN/Canais.png","sizes":"192x192","type":"image/png"},{"src":"https://i.ibb.co/7t6BpWkN/Canais.png","sizes":"512x512","type":"image/png"}]}' />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/video.js@8.17.4/dist/video-js.min.css" />
<script src="https://cdn.jsdelivr.net/npm/video.js@8.17.4/dist/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<style>
/* ===========================
   ELAS MERECEM — Design System
   =========================== */
:root{
  --pink-neon: {{primary_color}};
  --pink: {{primary_color}};
  --magenta: #c41e7a;
  --purple-deep: #3a0a4a;
  --navy: #0d0b2b;
  --black: #06020d;
  --bg-grad:radial-gradient(ellipse at top,#3a0a4a 0%,#1a0524 40%,{{bg_color}} 100%);
  --glass:rgba(255,255,255,.06);
  --glass-strong:rgba(255,255,255,.10);
  --glass-border:rgba(255,95,176,.22);
  --shadow-neon:0 0 24px rgba(255,45,146,.45),0 0 60px rgba(255,45,146,.18);
  --shadow-soft:0 10px 30px rgba(0,0,0,.55);
  --radius:18px;
  --radius-lg:24px;
  --txt:#fff;
  --txt-muted:rgba(255,255,255,.62);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{
  margin:0;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  color:var(--txt);
  background:var(--bg-grad);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 15% 20%,rgba(255,45,146,.18),transparent 40%),
    radial-gradient(circle at 85% 80%,rgba(196,30,122,.16),transparent 45%);
}
.app-shell{position:relative;z-index:1;min-height:100vh}
/* Scrollbars */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--pink-neon),var(--magenta));border-radius:10px}
::-webkit-scrollbar-track{background:transparent}

/* Typography helpers */
.brand-script{font-family:'Dancing Script',cursive;font-weight:700;color:var(--pink-neon);text-shadow:0 0 18px rgba(255,45,146,.7),0 0 38px rgba(255,45,146,.35);letter-spacing:.5px}
.brand-sub{letter-spacing:.45em;font-size:.7rem;color:#fff;opacity:.85}
.text-muted-2{color:var(--txt-muted)!important}

/* Glass card */
.glass{
  background:var(--glass);
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--glass-border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-soft);
}
.glass-strong{background:var(--glass-strong)}

/* Buttons */
.btn-neon{
  background:linear-gradient(135deg,var(--pink-neon),var(--magenta));
  color:#fff;border:none;border-radius:999px;font-weight:700;
  padding:.85rem 1.4rem;letter-spacing:.06em;
  box-shadow:var(--shadow-neon);
  transition:transform .2s ease,box-shadow .2s ease,filter .2s;
  position:relative;overflow:hidden;
}
.btn-neon:hover,.btn-neon:focus{color:#fff;transform:translateY(-1px);filter:brightness(1.08)}
.btn-neon:active{transform:translateY(0)}
.btn-ghost{
  background:transparent;color:#fff;border:1px solid var(--glass-border);border-radius:999px;
  padding:.6rem 1rem;font-weight:600;transition:all .2s;
}
.btn-ghost:hover{background:var(--glass);color:#fff}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:ripple .6s linear;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}

/* Inputs */
.field{position:relative;margin-bottom:.85rem}
.field .form-control{
  background:rgba(0,0,0,.35);border:1px solid var(--glass-border);color:#fff;
  border-radius:14px;padding:.95rem 1rem .95rem 2.85rem;height:auto;
  transition:all .2s;
}
.field .form-control::placeholder{color:rgba(255,255,255,.45)}
.field .form-control:focus{background:rgba(0,0,0,.5);border-color:var(--pink-neon);box-shadow:0 0 0 .2rem rgba(255,45,146,.18);color:#fff}
.field .ico{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--pink);font-size:1.1rem}
.field .pwd-toggle{position:absolute;right:.9rem;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.55);background:none;border:none}
.form-switch .form-check-input{background-color:rgba(255,255,255,.15);border-color:transparent;width:2.4em;height:1.3em}
.form-switch .form-check-input:checked{background-color:var(--pink-neon);border-color:var(--pink-neon);box-shadow:0 0 12px rgba(255,45,146,.6)}

/* Login page */
.login-page{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:1.2rem;position:relative;overflow:hidden;
  background:
    linear-gradient(180deg,rgba(6,2,13,.55),rgba(6,2,13,.85)),
    url('https://i.ibb.co/dJfWsVB3/ac137247-31dd-4512-b457-550266c7698f.png') center/cover no-repeat;
}
.login-card{width:100%;max-width:420px;padding:2rem 1.6rem;border-radius:24px}
.login-brand{text-align:center;margin-bottom:1.4rem}
.login-brand .brand-script{font-size:3.4rem;line-height:1}
.login-brand .brand-sub{margin-top:.25rem;display:block}
.login-brand .tag{display:block;margin-top:.8rem;color:rgba(255,255,255,.75);font-size:.9rem}

/* Header */
.app-header{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:.85rem 1rem;
  background:linear-gradient(180deg,rgba(6,2,13,.85),rgba(6,2,13,.55) 70%,transparent);
  backdrop-filter:blur(10px);
}
.app-header .brand-script{font-size:1.8rem}
.icon-btn{
  width:42px;height:42px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;
  background:var(--glass);border:1px solid var(--glass-border);color:#fff;font-size:1.15rem;transition:all .2s;
}
.icon-btn:hover{background:var(--glass-strong);color:var(--pink-neon)}

/* Bottom Nav */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:.4rem .25rem calc(.45rem + env(safe-area-inset-bottom));
  background:rgba(6,2,13,.78);backdrop-filter:blur(20px);
  border-top:1px solid var(--glass-border);
}
.bottom-nav .nav-item{
  background:none;border:none;color:rgba(255,255,255,.55);
  display:flex;flex-direction:column;align-items:center;gap:.15rem;
  padding:.45rem 0;font-size:.68rem;font-weight:600;letter-spacing:.04em;
  transition:color .2s;
}
.bottom-nav .nav-item i{font-size:1.35rem}
.bottom-nav .nav-item.active{color:var(--pink-neon);text-shadow:0 0 10px rgba(255,45,146,.55)}
.bottom-nav .nav-item.active i{filter:drop-shadow(0 0 6px rgba(255,45,146,.8))}

/* Page container */
.page{padding:0 1rem 110px;animation:fadeIn .35s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Hero banner */
.hero{
  position:relative;border-radius:var(--radius-lg);overflow:hidden;margin:.5rem 0 1.2rem;
  aspect-ratio:16/10;
  background:linear-gradient(135deg,#3a0a4a,#06020d);
  box-shadow:var(--shadow-soft);
}
.hero img{width:100%;height:100%;object-fit:cover;opacity:.85}
.hero-overlay{
  position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-between;
  padding:1.1rem;
  background:linear-gradient(180deg,transparent 30%,rgba(6,2,13,.85));
}
.hero h2{font-weight:800;font-size:1.6rem;margin:0;text-shadow:0 2px 12px rgba(0,0,0,.6)}

/* Shortcuts */
.shortcut-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-bottom:1.4rem}
.shortcut{
  position:relative;aspect-ratio:1/1;border-radius:20px;
  background:linear-gradient(135deg,rgba(255,45,146,.22),rgba(58,10,74,.55));
  border:1px solid var(--glass-border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;
  color:#fff;font-weight:700;font-size:.85rem;letter-spacing:.08em;
  cursor:pointer;transition:transform .25s,box-shadow .25s;
  overflow:hidden;
}
.shortcut::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(255,45,146,.35),transparent 65%);opacity:.6}
.shortcut:hover{transform:translateY(-3px);box-shadow:var(--shadow-neon)}
.shortcut i{font-size:2rem;color:#fff;filter:drop-shadow(0 0 10px rgba(255,45,146,.85));position:relative;z-index:1}
.shortcut span{position:relative;z-index:1}

/* Sections */
.section-head{display:flex;align-items:center;justify-content:space-between;margin:1.4rem 0 .7rem}
.section-head h3{margin:0;font-size:1.05rem;font-weight:700}
.section-head a{color:var(--pink-neon);font-size:.82rem;font-weight:600;text-decoration:none}

/* Horizontal scroller */
.h-scroll{display:flex;gap:.7rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:.4rem}
.h-scroll::-webkit-scrollbar{display:none}
.h-scroll > *{scroll-snap-align:start;flex:0 0 auto}

/* Poster cards */
.poster{
  width:128px;border-radius:14px;overflow:hidden;position:relative;
  background:var(--glass);border:1px solid var(--glass-border);
  cursor:pointer;transition:transform .25s,box-shadow .25s;
}
.poster:hover{transform:translateY(-3px);box-shadow:var(--shadow-neon)}
.poster .ratio{aspect-ratio:2/3;background:linear-gradient(135deg,#1a0524,#3a0a4a)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .meta{padding:.5rem .55rem}
.poster .meta .t{font-size:.8rem;font-weight:600;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.poster .meta .s{font-size:.7rem;color:var(--txt-muted)}
.poster .badge-novo{position:absolute;top:.4rem;left:.4rem;background:var(--pink-neon);color:#fff;font-size:.6rem;font-weight:800;padding:.15rem .4rem;border-radius:6px;letter-spacing:.08em;box-shadow:0 0 10px rgba(255,45,146,.6)}

/* Continue assistindo cards */
.cw-card{width:170px}
.cw-card .ratio{aspect-ratio:16/10}
.cw-progress{height:3px;background:rgba(255,255,255,.15)}
.cw-progress > span{display:block;height:100%;background:linear-gradient(90deg,var(--pink-neon),var(--magenta));box-shadow:0 0 8px var(--pink-neon)}

/* Category chips */
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.2rem 0 .5rem}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:.45rem .95rem;border-radius:999px;font-size:.78rem;font-weight:600;
  background:var(--glass);border:1px solid var(--glass-border);color:#fff;cursor:pointer;transition:all .2s;
}
.chip:hover{border-color:var(--pink)}
.chip.active{background:linear-gradient(135deg,var(--pink-neon),var(--magenta));border-color:transparent;box-shadow:var(--shadow-neon)}

/* Category tile (squared) */
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem}
.cat-tile{
  aspect-ratio:1/1;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;
  background:var(--glass);border:1px solid var(--glass-border);color:#fff;cursor:pointer;padding:.4rem;
  font-size:.7rem;text-align:center;font-weight:600;transition:all .2s;
}
.cat-tile:hover{background:var(--glass-strong);border-color:var(--pink)}
.cat-tile i{font-size:1.4rem;color:var(--pink-neon);filter:drop-shadow(0 0 6px rgba(255,45,146,.6))}
.cat-tile.active{background:linear-gradient(135deg,rgba(255,45,146,.55),rgba(196,30,122,.45));border-color:transparent;box-shadow:var(--shadow-neon)}
.cat-tile.active i{color:#fff}

/* Channel list rows */
.ch-row{
  display:flex;align-items:center;gap:.85rem;padding:.7rem .85rem;border-radius:16px;
  background:var(--glass);border:1px solid var(--glass-border);margin-bottom:.55rem;transition:all .2s;
}
.ch-row:hover{border-color:var(--pink);transform:translateX(2px)}
.ch-row .num{width:22px;color:var(--txt-muted);font-weight:700;font-size:.85rem;text-align:center}
.ch-logo{
  width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;
  border:1px solid rgba(255,255,255,.08);
}
.ch-logo img{max-width:80%;max-height:80%;object-fit:contain}
.ch-info{flex:1;min-width:0}
.ch-info .n{font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-info .c{font-size:.72rem;color:var(--txt-muted)}
.ch-actions{display:flex;align-items:center;gap:.25rem}
.ch-actions .icon-btn{width:36px;height:36px;border-radius:10px;font-size:1rem;background:transparent;border:none}
.ch-actions .icon-btn:hover{color:var(--pink-neon)}
.ch-actions .fav.active{color:var(--pink-neon)}

/* Grid of posters */
.poster-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
.poster-grid .poster{width:100%}

/* Skeleton */
.skeleton{position:relative;overflow:hidden;background:rgba(255,255,255,.06);border-radius:12px}
.skeleton::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);animation:shimmer 1.4s infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* Loading overlay */
.loading-overlay{
  position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;
  background:rgba(6,2,13,.78);backdrop-filter:blur(6px);
}
.loading-overlay.show{display:flex}
.spinner-neon{
  width:56px;height:56px;border-radius:50%;border:3px solid rgba(255,255,255,.12);
  border-top-color:var(--pink-neon);animation:spin .9s linear infinite;
  box-shadow:0 0 24px rgba(255,45,146,.5);
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
.toast-container{z-index:10000}
.toast{background:rgba(10,4,22,.95);border:1px solid var(--glass-border);color:#fff;border-radius:14px;box-shadow:var(--shadow-soft)}
.toast .toast-body{padding:.85rem 1rem;font-size:.88rem}

/* Modal / Player */
.modal-content.glass-modal{
  background:rgba(10,4,22,.94);border:1px solid var(--glass-border);
  border-radius:22px;color:#fff;backdrop-filter:blur(16px);
}
.modal-content.glass-modal .btn-close{filter:invert(1) brightness(1.5)}

/* Player */
.player-wrap{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:16/9;box-shadow:0 0 40px rgba(255,45,146,.35)}
.player-wrap video{width:100%;height:100%;display:block;background:#000}
#playerModal .modal-dialog{max-width:980px}
#playerModal .modal-content.glass-modal{background:linear-gradient(180deg,rgba(20,4,30,.96),rgba(6,2,13,.98));border:1px solid var(--glass-border)}
.player-title{font-size:1.05rem}
.player-actions{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.8rem}
.player-actions .btn-ghost{padding:.45rem .8rem;font-size:.82rem}
/* Video.js theming */
.video-js{width:100%;height:100%;font-family:inherit;background:#000;color:#fff}
.video-js .vjs-big-play-button{background:var(--pink-neon);border:none;border-radius:999px;width:76px;height:76px;line-height:76px;margin-left:-38px;margin-top:-38px;box-shadow:0 0 30px rgba(255,45,146,.7)}
.video-js:hover .vjs-big-play-button,.video-js .vjs-big-play-button:focus{background:var(--pink)}
.video-js .vjs-control-bar{background:linear-gradient(180deg,transparent,rgba(0,0,0,.82));height:4.2em;padding:0 .4em}
.video-js .vjs-play-progress,.video-js .vjs-volume-level{background:var(--pink-neon)}
.video-js .vjs-slider{background:rgba(255,255,255,.22)}
.video-js .vjs-load-progress{background:rgba(255,255,255,.16)}
.video-js .vjs-menu-button-popup .vjs-menu{bottom:3.7em}
.video-js .vjs-menu-content{background:rgba(10,4,22,.96);border:1px solid var(--glass-border);border-radius:12px;overflow:hidden}

/* Pagination */
.pager{display:flex;justify-content:center;align-items:center;gap:.5rem;margin:1rem 0 1.5rem;flex-wrap:wrap}
.pager button{
  min-width:42px;height:42px;padding:0 .8rem;border-radius:12px;
  background:var(--glass);border:1px solid var(--glass-border);color:#fff;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:.3rem;cursor:pointer;transition:all .2s;
}
.pager button:hover:not(:disabled){border-color:var(--pink);transform:translateY(-1px)}
.pager button.active{background:linear-gradient(135deg,var(--pink-neon),var(--magenta));border-color:transparent;box-shadow:var(--shadow-neon)}
.pager button:disabled{opacity:.35;cursor:not-allowed}
.pager .pg-info{color:var(--txt-muted);font-size:.8rem;width:100%;text-align:center;margin-top:.2rem}

/* Series episode list */
.season-tabs{display:flex;gap:.4rem;overflow-x:auto;padding:.4rem 0 .8rem}
.season-tabs::-webkit-scrollbar{display:none}
.season-pill{
  flex:0 0 auto;min-width:42px;height:42px;border-radius:14px;
  background:var(--glass);border:1px solid var(--glass-border);color:#fff;font-weight:700;font-size:.88rem;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;
}
.season-pill.active{background:linear-gradient(135deg,var(--pink-neon),var(--magenta));border-color:transparent;box-shadow:var(--shadow-neon)}
.ep-row{
  display:flex;align-items:center;gap:.7rem;padding:.7rem .85rem;border-radius:14px;
  background:var(--glass);border:1px solid var(--glass-border);margin-bottom:.5rem;cursor:pointer;transition:all .2s;
}
.ep-row:hover{border-color:var(--pink)}
.ep-row .num{font-size:.78rem;color:var(--pink-neon);font-weight:700;min-width:42px}
.ep-row .title{flex:1;font-size:.9rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep-row .ico{color:#fff;opacity:.7}

/* Profile */
.profile-hero{
  display:flex;align-items:center;gap:1rem;padding:1.2rem;border-radius:var(--radius-lg);
  background:linear-gradient(135deg,rgba(255,45,146,.22),rgba(58,10,74,.55));
  border:1px solid var(--glass-border);margin:.8rem 0 1rem;
}
.profile-avatar{
  width:64px;height:64px;border-radius:50%;
  background:linear-gradient(135deg,var(--pink-neon),var(--magenta));
  display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:800;color:#fff;
  box-shadow:var(--shadow-neon);
}
.profile-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin-bottom:.8rem}
.stat-card{padding:.9rem;border-radius:16px;background:var(--glass);border:1px solid var(--glass-border)}
.stat-card .lbl{font-size:.7rem;color:var(--txt-muted);letter-spacing:.08em;text-transform:uppercase}
.stat-card .val{font-size:1.1rem;font-weight:700;margin-top:.2rem}

/* Hidden helper */
.hidden{display:none!important}

/* Empty state */
.empty{text-align:center;padding:3rem 1rem;color:var(--txt-muted)}
.empty i{font-size:3rem;color:var(--pink);filter:drop-shadow(0 0 12px rgba(255,45,146,.6));margin-bottom:.6rem;display:block}

/* Responsive tweaks */
@media (min-width:540px){
  .poster-grid{grid-template-columns:repeat(4,1fr)}
  .cat-grid{grid-template-columns:repeat(6,1fr)}
}
@media (min-width:768px){
  .page{max-width:780px;margin:0 auto}
  .app-header{max-width:780px;margin:0 auto}
  .bottom-nav{max-width:780px;margin:0 auto;left:50%;transform:translateX(-50%);border-radius:22px 22px 0 0}
  .poster-grid{grid-template-columns:repeat(5,1fr)}
}
</style>
</head>
<body>

<div id="app" class="app-shell"></div>

<!-- Loading overlay -->
<div id="loading" class="loading-overlay" aria-hidden="true"><div class="spinner-neon"></div></div>

<!-- Toast container -->
<div class="toast-container position-fixed top-0 end-0 p-3" id="toastWrap"></div>

<!-- Player Modal -->
<div class="modal fade" id="playerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content glass-modal">
      <div class="modal-header border-0 pb-0">
        <div class="flex-grow-1 pe-2">
          <div class="player-title fw-bold" id="playerTitle">—</div>
          <div class="small text-muted-2" id="playerSubtitle">—</div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body pt-2">
        <div class="player-wrap" id="playerWrap"><video id="videoEl" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video></div>
        <div class="player-actions">
          <button class="btn-ghost" id="btnBack10"><i class="bi bi-arrow-counterclockwise me-1"></i>-10s</button>
          <button class="btn-ghost" id="btnFwd10"><i class="bi bi-arrow-clockwise me-1"></i>+10s</button>
          <button class="btn-ghost" id="btnPip"><i class="bi bi-pip me-1"></i>PiP</button>
          <button class="btn-ghost" id="btnFs"><i class="bi bi-arrows-fullscreen me-1"></i>Tela cheia</button>
          <button class="btn-ghost" id="btnFav"><i class="bi bi-heart me-1"></i>Favoritar</button>
        </div>
        <div id="playerExtra" class="mt-3 small text-muted-2"></div>
      </div>
    </div>
  </div>
</div>

<!-- Series Episodes Offcanvas -->
<div class="offcanvas offcanvas-bottom" tabindex="-1" id="seriesPanel" style="height:88vh;background:rgba(10,4,22,.97);color:#fff;border-top:1px solid var(--glass-border);border-radius:22px 22px 0 0">
  <div class="offcanvas-header">
    <div>
      <div class="fw-bold" id="seriesTitle">Série</div>
      <div class="small text-muted-2" id="seriesSubtitle"></div>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" style="filter:invert(1)"></button>
  </div>
  <div class="offcanvas-body" id="seriesBody"></div>
</div>

<script>
/* =====================================================
   ELAS MERECEM — App Logic (Vanilla ES2024 SPA)
   ===================================================== */
'use strict';

/* ---------- Utils ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const el = (tag,attrs={},...children)=>{
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){
    if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2),v);
    else if(v!=null)e.setAttribute(k,v);
  }
  for(const c of children.flat())if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));
  return e;
};
const store={
  get(k,d=null){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},
  del(k){try{localStorage.removeItem(k)}catch{}}
};
const showLoading=(b=true)=>$('#loading').classList.toggle('show',b);
const toast=(msg,variant='dark')=>{
  const id='t'+Date.now();
  const node=el('div',{class:`toast align-items-center border-0 show`,role:'status',id});
  node.innerHTML=`<div class="d-flex"><div class="toast-body"><i class="bi bi-${variant==='danger'?'exclamation-triangle-fill text-danger':'heart-fill'} me-2" style="color:var(--pink-neon)"></i>${msg}</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
  $('#toastWrap').append(node);
  const t=new bootstrap.Toast(node,{delay:3500});t.show();
  node.addEventListener('hidden.bs.toast',()=>node.remove());
};
const ripple=(e)=>{
  const btn=e.currentTarget;const r=btn.getBoundingClientRect();
  const d=Math.max(r.width,r.height);
  const s=el('span',{class:'ripple'});
  s.style.width=s.style.height=d+'px';
  s.style.left=(e.clientX-r.left-d/2)+'px';
  s.style.top=(e.clientY-r.top-d/2)+'px';
  btn.append(s);setTimeout(()=>s.remove(),650);
};
const fmtDate=(ts)=>{if(!ts)return'—';const d=new Date((+ts)*1000);return isNaN(d)?'—':d.toLocaleDateString('pt-BR')};

/* ---------- State ---------- */
const state={
  creds:store.get('em.creds'),
  remember:store.get('em.remember',true),
  user:null,
  server:null,
  page:'home',
  cache:{liveCats:null,liveStreams:null,vodCats:null,vodStreams:null,seriesCats:null,series:null},
  favorites:store.get('em.favs',{live:[],vod:[],series:[]}),
  history:store.get('em.history',{recent:[],progress:{}}),
  filter:{live:'',vod:'',series:''},
  pageNum:{live:1,vod:1,series:1},
  pageSize:{live:60,vod:36,series:36},
  current:null
};

/* ---------- Xtream API ---------- */
const api={
  base(){return `${state.creds.server.replace(/\/+$/,'')}/player_api.php?username=${encodeURIComponent(state.creds.user)}&password=${encodeURIComponent(state.creds.pass)}`},
  async call(action='',extra=''){
    const url=`${api.base()}${action?`&action=${action}`:''}${extra}`;
    const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  },
  streamLive(id){return `${state.creds.server.replace(/\/+$/,'')}/live/${encodeURIComponent(state.creds.user)}/${encodeURIComponent(state.creds.pass)}/${id}.m3u8`},
  streamVod(id,ext='mp4'){return `${state.creds.server.replace(/\/+$/,'')}/movie/${encodeURIComponent(state.creds.user)}/${encodeURIComponent(state.creds.pass)}/${id}.${ext}`},
  streamEp(id,ext='mp4'){return `${state.creds.server.replace(/\/+$/,'')}/series/${encodeURIComponent(state.creds.user)}/${encodeURIComponent(state.creds.pass)}/${id}.${ext}`},
};

/* ---------- Login ---------- */
function renderLogin(){
  document.body.style.padding='0';
  $('#app').innerHTML='';
  const c=state.creds||{server:'',user:'',pass:''};
  const page=el('div',{class:'login-page'});
  page.innerHTML=`
    <form class="login-card glass" id="loginForm" autocomplete="on">
      <div class="login-brand">
        <span class="brand-script">Elas</span>
        <span class="brand-sub d-block">MERECEM</span>
        <span class="tag">Seu momento, seu mundo.</span>
      </div>
      <div class="field">
        <i class="ico bi bi-hdd-network"></i>
        <input class="form-control" name="server" type="url" placeholder="URL do servidor" value="${c.server||''}" required />
      </div>
      <div class="field">
        <i class="ico bi bi-person"></i>
        <input class="form-control" name="user" type="text" placeholder="Usuário" value="${c.user||''}" autocomplete="username" required />
      </div>
      <div class="field">
        <i class="ico bi bi-lock"></i>
        <input class="form-control" name="pass" type="password" placeholder="Senha" value="${c.pass||''}" autocomplete="current-password" required />
        <button type="button" class="pwd-toggle" id="pwdT"><i class="bi bi-eye-slash"></i></button>
      </div>
      <div class="form-check form-switch mb-3 ms-1">
        <input class="form-check-input" type="checkbox" id="remember" ${state.remember?'checked':''}>
        <label class="form-check-label small" for="remember">Lembrar meus dados</label>
      </div>
      <button class="btn-neon w-100" type="submit">
        <i class="bi bi-heart-fill me-2"></i>CONECTAR
      </button>
      <div class="text-center mt-3 small text-muted-2"><i class="bi bi-stars me-1"></i>Feito para você. Feito para elas.</div>
    </form>`;
  $('#app').append(page);
  $('#pwdT').addEventListener('click',(e)=>{
    const i=e.currentTarget.previousElementSibling;
    i.type=i.type==='password'?'text':'password';
    e.currentTarget.firstElementChild.className='bi bi-'+(i.type==='password'?'eye-slash':'eye');
  });
  $('#loginForm').addEventListener('submit',async(e)=>{
    e.preventDefault();
    const fd=new FormData(e.currentTarget);
    const creds={server:fd.get('server').trim().replace(/\/+$/,''),user:fd.get('user').trim(),pass:fd.get('pass')};
    const remember=$('#remember').checked;
    state.creds=creds;state.remember=remember;
    showLoading(true);
    try{
      const data=await api.call();
      if(!data||!data.user_info||data.user_info.auth===0)throw new Error('Credenciais inválidas');
      state.user=data.user_info;state.server=data.server_info;
      if(remember){store.set('em.creds',creds);store.set('em.remember',true)}
      else{store.del('em.creds')}
      toast('Bem-vinda! Login realizado.');
      mountApp();navigate('home',{push:false});history.replaceState({page:'home'},'','#/home');
    }catch(err){
      toast('Falha ao conectar: '+err.message,'danger');
    }finally{showLoading(false)}
  });
  $$('.btn-neon, .icon-btn').forEach(b=>b.addEventListener('click',ripple));
}

/* ---------- App Shell ---------- */
function mountApp(){
  document.body.style.padding='0';
  $('#app').innerHTML=`
    <header class="app-header">
      <button class="icon-btn" id="menuBtn" aria-label="Menu"><i class="bi bi-list"></i></button>
      <div class="text-center">
        <div class="brand-script" style="font-size:1.7rem;line-height:1">Elas</div>
        <div class="brand-sub" style="font-size:.55rem">MERECEM</div>
      </div>
      <button class="icon-btn" id="searchBtn" aria-label="Buscar"><i class="bi bi-search"></i></button>
    </header>
    <main id="view"></main>
    <nav class="bottom-nav" role="navigation" aria-label="Navegação principal">
      {{nav_items}}
    </nav>`;
  $$('.bottom-nav .nav-item').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
  $('#searchBtn').addEventListener('click',()=>{
    const q=prompt('Buscar (canais, filmes ou séries):');
    if(q!=null){
      state.filter.live=state.filter.vod=state.filter.series=q.trim();
      if(['live','vod','series'].includes(state.page))navigate(state.page);
      else navigate('live');
    }
  });
  $('#menuBtn').addEventListener('click',()=>{if(confirm('Sair da conta?')){store.del('em.creds');location.reload()}});
}

/* ---------- Router ---------- */
function navigate(page,{push=true}={}){
  if(!({home:1,live:1,vod:1,series:1,profile:1})[page])page='home';
  state.page=page;
  $$('.bottom-nav .nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  const v=$('#view');v.innerHTML='';
  const wrap=el('div',{class:'page'});v.append(wrap);
  ({home:renderHome,live:renderLive,vod:renderVod,series:renderSeries,profile:renderProfile}[page])(wrap);
  window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'});
  if(push && location.hash!=='#/'+page)history.pushState({page},'','#/'+page);
}
window.addEventListener('popstate',(e)=>{
  // close any open modal/offcanvas first
  const pm=bootstrap.Modal.getInstance('#playerModal');
  const sp=bootstrap.Offcanvas.getInstance('#seriesPanel');
  if(pm && $('#playerModal').classList.contains('show')){pm.hide();return}
  if(sp && $('#seriesPanel').classList.contains('show')){sp.hide();return}
  const p=(location.hash||'').replace(/^#\/?/,'')||'home';
  if(state.user)navigate(p,{push:false});
});

/* ---------- HOME ---------- */
async function renderHome(root){
  root.innerHTML=`
    <div class="hero">
      <img src="https://i.ibb.co/dJfWsVB3/ac137247-31dd-4512-b457-550266c7698f.png" alt="Banner Elas Merecem" loading="lazy"/>
      <div class="hero-overlay">
        <h2>Aproveite<br/>seu tempo <i class="bi bi-heart-fill" style="color:var(--pink-neon);font-size:1.1rem"></i></h2>
      </div>
    </div>
    <div class="shortcut-row">
      <button class="shortcut" data-go="live"><i class="bi bi-broadcast-pin"></i><span>CANAIS</span></button>
      <button class="shortcut" data-go="vod"><i class="bi bi-film"></i><span>FILMES</span></button>
      <button class="shortcut" data-go="series"><i class="bi bi-play-btn-fill"></i><span>SÉRIES</span></button>
    </div>
    <div id="homeCW"></div>
    <div id="homeFavs"></div>
    <div id="homeCats"></div>`;
  $$('.shortcut',root).forEach(b=>{b.addEventListener('click',()=>navigate(b.dataset.go));b.addEventListener('click',ripple)});

  // Continue assistindo
  const cw=Object.values(state.history.progress||{}).sort((a,b)=>b.ts-a.ts).slice(0,8);
  const cwSec=$('#homeCW',root);
  if(cw.length){
    cwSec.append(el('div',{class:'section-head',html:`<h3>Continue assistindo</h3>`}));
    const sc=el('div',{class:'h-scroll'});
    cw.forEach(it=>{
      const pct=it.duration?Math.min(100,Math.round((it.time/it.duration)*100)):20;
      const card=el('div',{class:'poster cw-card'});
      card.innerHTML=`
        <div class="ratio">${it.cover?`<img src="${it.cover}" loading="lazy" onerror="this.style.display='none'"/>`:''}</div>
        <div class="cw-progress"><span style="width:${pct}%"></span></div>
        <div class="meta"><div class="t">${it.title||'—'}</div><div class="s">${it.kind==='vod'?'Filme':it.kind==='ep'?'Episódio':'Canal'}</div></div>`;
      card.addEventListener('click',()=>resumeItem(it));
      sc.append(card);
    });
    cwSec.append(sc);
  }

  // Favoritos
  const favCount=state.favorites.live.length+state.favorites.vod.length+state.favorites.series.length;
  const fsec=$('#homeFavs',root);
  if(favCount){
    fsec.append(el('div',{class:'section-head',html:`<h3>Seus favoritos</h3><a href="#" data-go="profile">Ver tudo</a>`}));
    const sc=el('div',{class:'h-scroll'});
    [...state.favorites.vod.slice(0,6).map(x=>({...x,kind:'vod'})),
     ...state.favorites.series.slice(0,6).map(x=>({...x,kind:'series'}))].slice(0,10).forEach(it=>{
      const p=el('div',{class:'poster'});
      p.innerHTML=`<div class="ratio">${it.cover?`<img src="${it.cover}" loading="lazy"/>`:''}</div><div class="meta"><div class="t">${it.name||it.title}</div><div class="s">${it.kind==='vod'?'Filme':'Série'}</div></div>`;
      p.addEventListener('click',()=>{
        if(it.kind==='vod')openVod(it);else openSeries(it);
      });
      sc.append(p);
    });
    fsec.append(sc);
    fsec.querySelector('a[data-go]')?.addEventListener('click',(e)=>{e.preventDefault();navigate('profile')});
  }

  // Categorias populares (pega das ao vivo)
  const cats=$('#homeCats',root);
  cats.append(el('div',{class:'section-head',html:`<h3>Categorias populares</h3><a href="#" data-go="live">Ver tudo</a>`}));
  cats.querySelector('a[data-go]').addEventListener('click',(e)=>{e.preventDefault();navigate('live')});
  const grid=el('div',{class:'cat-grid'});
  const icons=['bi-tv','bi-trophy-fill','bi-film','bi-balloon-heart-fill','bi-newspaper'];
  const labels=['Todos','Esportes','Filmes','Infantil','Notícias'];
  labels.forEach((l,i)=>{
    const t=el('button',{class:'cat-tile'+(i===0?' active':'')});
    t.innerHTML=`<i class="bi ${icons[i]}"></i><span>${l}</span>`;
    t.addEventListener('click',()=>navigate('live'));
    grid.append(t);
  });
  cats.append(grid);
}

function resumeItem(it){
  if(it.kind==='vod')openVod({stream_id:it.id,name:it.title,stream_icon:it.cover,container_extension:it.ext});
  else if(it.kind==='ep')playEpisode({id:it.id,title:it.title,container_extension:it.ext,info:{movie_image:it.cover}},it.seriesName||'Série');
  else if(it.kind==='live')playLive({stream_id:it.id,name:it.title,stream_icon:it.cover},it.cat||'');
}

/* ---------- LIVE / CANAIS ---------- */
async function renderLive(root){
  root.innerHTML=`
    <h2 class="mt-2 mb-3 fw-bold" style="font-size:1.3rem">Canais</h2>
    <div class="chips" id="liveChips"></div>
    <div class="mb-2"><input id="liveSearch" class="form-control" placeholder="Buscar canal..." style="background:rgba(0,0,0,.35);border:1px solid var(--glass-border);color:#fff;border-radius:12px"/></div>
    <div id="liveList"></div>
    <div id="livePager" class="pager"></div>`;
  $('#liveSearch',root).value=state.filter.live||'';
  $('#liveSearch',root).addEventListener('input',(e)=>{state.filter.live=e.target.value;state.pageNum.live=1;renderLiveList()});
  await loadLive();
  buildChips($('#liveChips',root),state.cache.liveCats,(catId)=>{state.activeLiveCat=catId;state.pageNum.live=1;renderLiveList()});
  renderLiveList();
}
async function loadLive(){
  if(state.cache.liveCats&&state.cache.liveStreams)return;
  showLoading(true);
  try{
    const[cats,streams]=await Promise.all([api.call('get_live_categories'),api.call('get_live_streams')]);
    state.cache.liveCats=cats||[];state.cache.liveStreams=streams||[];
  }catch(e){toast('Erro ao carregar canais','danger')}finally{showLoading(false)}
}
function renderLiveList(){
  const list=$('#liveList');if(!list)return;
  const q=(state.filter.live||'').toLowerCase();
  const cat=state.activeLiveCat;
  let items=state.cache.liveStreams||[];
  if(cat)items=items.filter(s=>String(s.category_id)===String(cat));
  if(q)items=items.filter(s=>(s.name||'').toLowerCase().includes(q));
  const total=items.length;
  const size=state.pageSize.live;
  const pages=Math.max(1,Math.ceil(total/size));
  if(state.pageNum.live>pages)state.pageNum.live=pages;
  const pg=state.pageNum.live;
  items=items.slice((pg-1)*size,pg*size);
  list.innerHTML='';
  if(!items.length){list.append(emptyState('Nenhum canal encontrado'));renderPager('live',1,1,0);return}
  const catMap=Object.fromEntries((state.cache.liveCats||[]).map(c=>[c.category_id,c.category_name]));
  items.forEach((s,i)=>{
    const idx=(pg-1)*size+i+1;
    const favd=state.favorites.live.some(f=>f.id===s.stream_id);
    const row=el('div',{class:'ch-row'});
    row.innerHTML=`
      <div class="num">${idx}</div>
      <div class="ch-logo">${s.stream_icon?`<img src="${s.stream_icon}" loading="lazy" onerror="this.parentNode.innerHTML='<i class=\\'bi bi-broadcast\\' style=\\'color:var(--pink)\\'></i>'"/>`:`<i class="bi bi-broadcast" style="color:var(--pink)"></i>`}</div>
      <div class="ch-info"><div class="n">${s.name||'Canal'}</div><div class="c">${catMap[s.category_id]||'—'}</div></div>
      <div class="ch-actions">
        <button class="icon-btn fav ${favd?'active':''}" title="Favoritar"><i class="bi bi-heart${favd?'-fill':''}"></i></button>
        <button class="icon-btn play"><i class="bi bi-play-fill"></i></button>
      </div>`;
    row.querySelector('.fav').addEventListener('click',(e)=>{e.stopPropagation();toggleFav('live',{id:s.stream_id,name:s.name,cover:s.stream_icon});renderLiveList()});
    const go=()=>playLive(s,catMap[s.category_id]||'');
    row.addEventListener('click',go);
    list.append(row);
  });
  renderPager('live',pg,pages,total);
}
function buildChips(host,cats,onSel){
  host.innerHTML='';
  const all=el('button',{class:'chip active'},'TODOS');
  all.addEventListener('click',()=>{$$('.chip',host).forEach(c=>c.classList.remove('active'));all.classList.add('active');onSel(null)});
  host.append(all);
  (cats||[]).slice(0,30).forEach(c=>{
    const ch=el('button',{class:'chip'},c.category_name);
    ch.addEventListener('click',()=>{$$('.chip',host).forEach(x=>x.classList.remove('active'));ch.classList.add('active');onSel(c.category_id)});
    host.append(ch);
  });
}

/* ---------- VOD / FILMES ---------- */
async function renderVod(root){
  root.innerHTML=`
    <h2 class="mt-2 mb-3 fw-bold" style="font-size:1.3rem">Filmes</h2>
    <div class="chips" id="vodChips"></div>
    <div class="mb-2"><input id="vodSearch" class="form-control" placeholder="Buscar filme..." style="background:rgba(0,0,0,.35);border:1px solid var(--glass-border);color:#fff;border-radius:12px"/></div>
    <div class="section-head"><h3>Catálogo</h3><span class="small text-muted-2" id="vodCount"></span></div>
    <div id="vodGrid" class="poster-grid"></div>
    <div id="vodPager" class="pager"></div>`;
  $('#vodSearch',root).value=state.filter.vod||'';
  $('#vodSearch',root).addEventListener('input',(e)=>{state.filter.vod=e.target.value;state.pageNum.vod=1;renderVodGrid()});
  await loadVod();
  buildChips($('#vodChips',root),state.cache.vodCats,(c)=>{state.activeVodCat=c;state.pageNum.vod=1;renderVodGrid()});
  renderVodGrid();
}
async function loadVod(){
  if(state.cache.vodCats&&state.cache.vodStreams)return;
  showLoading(true);
  try{
    const[cats,streams]=await Promise.all([api.call('get_vod_categories'),api.call('get_vod_streams')]);
    state.cache.vodCats=cats||[];state.cache.vodStreams=streams||[];
  }catch(e){toast('Erro ao carregar filmes','danger')}finally{showLoading(false)}
}
function renderVodGrid(){
  const grid=$('#vodGrid');if(!grid)return;
  const q=(state.filter.vod||'').toLowerCase();
  let items=state.cache.vodStreams||[];
  if(state.activeVodCat)items=items.filter(s=>String(s.category_id)===String(state.activeVodCat));
  if(q)items=items.filter(s=>(s.name||'').toLowerCase().includes(q));
  const total=items.length;
  $('#vodCount').textContent=`${total} títulos`;
  const size=state.pageSize.vod;
  const pages=Math.max(1,Math.ceil(total/size));
  if(state.pageNum.vod>pages)state.pageNum.vod=pages;
  const pg=state.pageNum.vod;
  items=items.slice((pg-1)*size,pg*size);
  grid.innerHTML='';
  if(!items.length){grid.append(emptyState('Nenhum filme encontrado'));renderPager('vod',1,1,0);return}
  items.forEach(s=>{
    const isNew=s.added && (Date.now()/1000 - +s.added) < 60*60*24*30;
    const p=el('div',{class:'poster'});
    p.innerHTML=`
      ${isNew?'<span class="badge-novo">NOVO</span>':''}
      <div class="ratio">${s.stream_icon?`<img src="${s.stream_icon}" loading="lazy" onerror="this.style.display='none'"/>`:''}</div>

async function loadSeries(){

  showLoading(true);

    const[cats,list]=await Promise.all([api.call('get_series_categories'),api.call('get_series')]);
    state.cache.seriesCats=cats||[];state.cache.series=list||[];
  }catch(e){toast('Erro ao carregar séries','danger')}finally{showLoading(false)}

function renderSerGrid(){
  const grid=$('#serGrid');if(!grid)return;
  const q=(state.filter.series||'').toLowerCase();
  let items=state.cache.series||[];
  if(state.activeSerCat)items=items.filter(s=>String(s.category_id)===String(state.activeSerCat));

  $('#serCount').textContent=`${total} títulos`;

function playEpisode(ep,seriesName){
  const ext=(ep.container_extension||'mp4').toLowerCase();
  const url=api.streamEp(ep.id,ext);
  // Não fecha o painel de episódios — usuário volta para a lista ao fechar o player

}

/* ---------- PLAYER ---------- */
let videojsPlayer=null, mpegtsInstance=null;
function detectType(url,ext){
  const u=(url||'').toLowerCase().split('?')[0];
  const e=normalizeExt(ext);
  if(e==='m3u8'||e==='m3u'||u.endsWith('.m3u8')||u.endsWith('.m3u'))return 'hls';
  if(e==='ts'||e==='mts'||e==='m2ts'||e==='mpegts'||u.endsWith('.ts')||u.endsWith('.mts')||u.endsWith('.m2ts'))return 'mpegts';
  if(e==='mp4'||e==='m4v'||e==='mov'||u.endsWith('.mp4')||u.endsWith('.m4v')||u.endsWith('.mov'))return 'mp4';
  if(e==='mkv'||u.endsWith('.mkv'))return 'mkv';
  if(e==='webm'||u.endsWith('.webm'))return 'webm';
  return 'native';
}
function normalizeExt(ext){return (ext||'').toLowerCase().replace(/^\./,'')}
function replaceUrlExt(url,ext){
  const [base,query='']=(url||'').split('?');
  const next=base.match(/\.[^/.]+$/)?base.replace(/\.[^/.]+$/,'.'+ext):base+'.'+ext;
  return next+(query?'?'+query:'');
}
function sourceMime(type){
  if(type==='hls')return 'application/x-mpegURL';
  if(type==='mp4')return 'video/mp4';
  if(type==='webm')return 'video/webm';
  if(type==='mpegts')return 'video/mp2t';
  return '';
}
function buildSourceQueue(url,type,ext,kind){
  const queue=[];
  const add=(src,t)=>{if(src&&!queue.some(x=>x.src===src)){queue.push({src,type:t,mime:sourceMime(t)})}};
  add(url,type);
  const e=normalizeExt(ext);
  const fallbacks=kind==='live'?['m3u8','ts']:['mp4','mkv','ts','m3u8'];
  fallbacks.forEach(f=>{if(f!==e)add(replaceUrlExt(url,f),detectType(url,f))});
  return queue;
}
function resetVideoJs(){
  if(mpegtsInstance){try{mpegtsInstance.pause();mpegtsInstance.unload();mpegtsInstance.detachMediaElement();mpegtsInstance.destroy()}catch{}mpegtsInstance=null}
  if(videojsPlayer){try{videojsPlayer.pause();videojsPlayer.dispose()}catch{}videojsPlayer=null}
  const wrap=$('#playerWrap');
  if(wrap)wrap.innerHTML='<video id="videoEl" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video>';
}
function openPlayer({title,subtitle,url,extraHTML='',kind,id,cover,ext,seriesName}){
  state.current={kind,id,title,cover,ext,seriesName};
  $('#playerTitle').textContent=title||'—';
  $('#playerSubtitle').textContent=subtitle||'';
  $('#playerExtra').innerHTML=extraHTML;
  resetVideoJs();

  const type=detectType(url,ext);
  const key=`${kind}:${id}`;
  const saved=state.history.progress[key];
  const sources=buildSourceQueue(url,type,ext,kind);
  let sourceIndex=0;
  const player=videojs('videoEl',{
    controls:true,
    autoplay:false,
    preload:'auto',
    fluid:false,
    responsive:true,
    liveui:kind==='live',
    playbackRates:[0.5,0.75,1,1.25,1.5,2],
    html5:{
      vhs:{overrideNative:false,enableLowInitialPlaylist:true,smoothQualityChange:true},
      nativeAudioTracks:false,
      nativeVideoTracks:false
    },
    controlBar:{
      pictureInPictureToggle:true,
      volumePanel:{inline:false},
      skipButtons:{forward:10,backward:10}
    },
    userActions:{hotkeys:true},
    language:'pt-BR',
    languages:{'pt-BR':{
      'Play':'Reproduzir','Pause':'Pausar','Mute':'Mudo','Unmute':'Som',
      'Fullscreen':'Tela cheia','Non-Fullscreen':'Sair da tela cheia',
      'Picture-in-Picture':'PiP','Playback Rate':'Velocidade'
    }}
  });
  videojsPlayer=player;

  player.ready(()=>{
    const mediaEl=player.tech({IWillNotUseThisInPlugins:true}).el();
    const canMpegTs=()=>window.mpegts && mpegts.getFeatureList && (mpegts.getFeatureList().msePlayback||mpegts.getFeatureList().mseLivePlayback);
    const cleanupMpegTs=()=>{if(mpegtsInstance){try{mpegtsInstance.pause();mpegtsInstance.unload();mpegtsInstance.detachMediaElement();mpegtsInstance.destroy()}catch{}mpegtsInstance=null}};
    const resume=()=>{
      if(saved&&saved.time&&kind!=='live')player.currentTime(Math.max(0,saved.time-3));
      player.play().catch(()=>{});
    };
    const tryNextSource=()=>{
      cleanupMpegTs();
      const item=sources[sourceIndex]||{src:url,type,mime:sourceMime(type)};
      player.one('loadedmetadata',resume);
      if(item.type==='mpegts' && canMpegTs()){
        mpegtsInstance=mpegts.createPlayer({type:'mpegts',isLive:kind==='live',url:item.src},{enableWorker:true,lazyLoad:false,liveBufferLatencyChasing:kind==='live'});
        mpegtsInstance.attachMediaElement(mediaEl);
        mpegtsInstance.load();
        mpegtsInstance.on(mpegts.Events.ERROR,()=>{
          if(sourceIndex<sources.length-1){sourceIndex++;tryNextSource();return}
          toast('Erro no player','danger');
        });
      }else{
        player.src(item.mime?{src:item.src,type:item.mime}:{src:item.src});
        player.load();
      }
    };
    player.on('timeupdate',()=>{
      const d=player.duration();if(!d||isNaN(d)||kind==='live')return;
      const t=player.currentTime();
      state.history.progress[key]={kind,id,title,cover,ext,seriesName,time:t,duration:d,ts:Date.now()};
      if(Math.floor(t)%5===0)store.set('em.history',state.history);
    });
    player.on('error',()=>{
      const err=player.error();
      console.warn('Video.js player error',err,sources[sourceIndex]?.src||url);
      if(sourceIndex<sources.length-1){sourceIndex++;tryNextSource();return}
      toast('Erro no player','danger');
    });
    tryNextSource();
  });

  // sync fav button
  const favKey=kind==='ep'?'series':kind;
  const favId=kind==='ep'?null:id;
  const favBtn=$('#btnFav');
  if(favId!=null){
    const isFav=state.favorites[favKey]?.some(x=>x.id===favId);
    favBtn.style.display='';
    favBtn.innerHTML=`<i class="bi bi-heart${isFav?'-fill':''} me-1"></i>${isFav?'Favoritado':'Favoritar'}`;
  }else favBtn.style.display='none';

  new bootstrap.Modal('#playerModal').show();
}

// Player action buttons
$('#btnBack10').addEventListener('click',()=>{if(videojsPlayer)videojsPlayer.currentTime(Math.max(0,videojsPlayer.currentTime()-10))});
$('#btnFwd10').addEventListener('click',()=>{if(videojsPlayer)videojsPlayer.currentTime(videojsPlayer.currentTime()+10)});

$('#btnFav').addEventListener('click',()=>{

$('#playerModal').addEventListener('hidden.bs.modal',()=>{
  resetVideoJs();
  store.set('em.history',state.history);
});

/* ---------- Pagination helper ---------- */
function renderPager(kind,page,pages,total){
  const hostId={live:'#livePager',vod:'#vodPager',series:'#serPager'}[kind];
  const host=$(hostId);if(!host)return;
  host.innerHTML='';
  if(pages<=1){host.append(el('div',{class:'pg-info'},total?`${total} resultado(s)`:''));return}
  const go=(p)=>{state.pageNum[kind]=Math.min(pages,Math.max(1,p));({live:renderLiveList,vod:renderVodGrid,series:renderSerGrid}[kind])();window.scrollTo({top:0,behavior:'smooth'})};
  const mk=(html,p,opts={})=>{const b=el('button',{},'');b.innerHTML=html;if(opts.disabled)b.disabled=true;if(opts.active)b.classList.add('active');b.addEventListener('click',()=>go(p));return b};
  host.append(mk('<i class="bi bi-chevron-double-left"></i>',1,{disabled:page===1}));
  host.append(mk('<i class="bi bi-chevron-left"></i> Anterior',page-1,{disabled:page===1}));
  // window of pages
  const win=2;
  const start=Math.max(1,page-win),end=Math.min(pages,page+win);
  if(start>1)host.append(mk('1',1));
  if(start>2)host.append(el('span',{class:'pg-info',style:'width:auto;margin:0 .2rem'},'…'));
  for(let p=start;p<=end;p++)host.append(mk(String(p),p,{active:p===page}));
  if(end<pages-1)host.append(el('span',{class:'pg-info',style:'width:auto;margin:0 .2rem'},'…'));
  if(end<pages)host.append(mk(String(pages),pages));
  host.append(mk('Próxima <i class="bi bi-chevron-right"></i>',page+1,{disabled:page===pages}));
  host.append(mk('<i class="bi bi-chevron-double-right"></i>',pages,{disabled:page===pages}));
  host.append(el('div',{class:'pg-info'},`Página ${page} de ${pages} • ${total} resultado(s)`));
}

  $('#logoutBtn').addEventListener('click',()=>{if(confirm('Deseja sair?')){store.del('em.creds');location.reload()}});

/* ---------- Favorites ---------- */
function toggleFav(kind,item){
  const arr=state.favorites[kind];
  const i=arr.findIndex(x=>x.id===item.id);
  if(i>=0){arr.splice(i,1);toast('Removido dos favoritos')}
  else{arr.push(item);toast('Adicionado aos favoritos ❤')}
  store.set('em.favs',state.favorites);
}

/* ---------- Helpers ---------- */
function emptyState(msg){
  const d=el('div',{class:'empty'});
  d.innerHTML=`<i class="bi bi-heart"></i><div>${msg}</div>`;
  return d;
}

/* ---------- PWA ---------- */
/* Service worker removido: o antigo registrava um listener de 'fetch' vazio
   (sem event.respondWith), o que fazia o navegador tratar TODAS as requisições
   da página — inclusive as chamadas à API Xtream e os streams de vídeo — como
   controladas por um SW que não responde nada. Isso causava falhas de rede
   silenciosas após alguns minutos, dando a impressão de "sessão expirada".
   O app não depende de SW para funcionar, então não há necessidade de registrar um aqui. */

/* ---------- Boot ---------- */
async function boot(){
  if(state.creds && state.remember){
    showLoading(true);
    try{
      const data=await api.call();
      if(data?.user_info?.auth!==0){
        state.user=data.user_info;state.server=data.server_info;
        mountApp();
        const initial=(location.hash||'').replace(/^#\/?/,'')||'home';
        navigate(initial,{push:false});
        showLoading(false);return;
      }
    }catch{}
    showLoading(false);
  }
  renderLogin();
}
boot();

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="{{bg_color}}" />
<title>{{app_name}}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/video.js@8.17.4/dist/video-js.min.css" />
<script src="https://cdn.jsdelivr.net/npm/video.js@8.17.4/dist/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<style>
/* =========================================================
   BASE DO SISTEMA (Nunca muda, aplicado em todos os modelos)
   ========================================================= */
:root {
  --primary-color: {{primary_color}};
  --primary-rgb: {{primary_rgb}};
  --bg-app: {{bg_color}};
  --glass: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.10);
  --shadow: 0 0 30px rgba({{primary_rgb}}, 0.3);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
body{background:var(--bg-app);color:#f5f5f5;min-height:100vh;overflow-x:hidden;}

/* TELA DE LOGIN */
.login-screen{position:fixed;inset:0;z-index:9999;background:var(--bg-app);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.login-screen .logo{font-size:2.2rem;font-weight:800;color:var(--primary-color);text-shadow:var(--shadow);margin-bottom:30px;}
.login-card{width:100%;max-width:380px;background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;padding:25px;}
.login-card input{width:100%;padding:14px;background:rgba(0,0,0,0.4);border:1px solid var(--glass-border);border-radius:12px;color:#fff;margin-bottom:12px;outline:none;transition:0.3s;font-size:15px;}
.login-card input:focus{border-color:var(--primary-color);}
.login-card button{width:100%;padding:14px;background:var(--primary-color);border:none;border-radius:12px;color:#fff;font-weight:bold;font-size:1rem;cursor:pointer;transition:0.3s;box-shadow:var(--shadow);}
.login-card button:hover{transform:translateY(-2px);}

/* SPLASH SCREEN */
#splash-screen{position:fixed;inset:0;z-index:10000;background:var(--bg-app);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.8s ease;}
#splash-screen.hide{opacity:0;pointer-events:none;}
.splash-logo{font-size:3rem;font-weight:800;color:var(--primary-color);text-shadow:var(--shadow);}
.splash-loader{margin-top:30px;width:40px;height:40px;border:4px solid rgba(255,255,255,0.1);border-top-color:var(--primary-color);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* APP */
#app{display:none;padding-bottom:80px;}

/* =========================================================
   ESTILO DE MENU (Escolha do Gerador)
   ========================================================= */
{{menu_style_start}}
/* MODELO 1: MENU BAIXO (Padrão) */
.bottom-nav.baixo{position:fixed;bottom:0;width:100%;background:rgba(0,0,0,0.8);backdrop-filter:blur(20px);border-top:1px solid var(--glass-border);display:flex;justify-content:space-around;padding:10px 0;z-index:100;}
.bottom-nav.baixo button{background:none;border:none;color:rgba(255,255,255,0.4);display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:600;cursor:pointer;transition:0.3s;}
.bottom-nav.baixo button.active{color:var(--primary-color);}

/* MODELO 2: MENU LATERAL (Esquerdo) */
.bottom-nav.lateral{position:fixed;left:0;top:0;width:80px;height:100vh;background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);border-right:1px solid var(--glass-border);display:flex;flex-direction:column;justify-content:center;gap:30px;padding:20px 0;z-index:100;}
.bottom-nav.lateral button{background:none;border:none;color:rgba(255,255,255,0.4);display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:600;cursor:pointer;transition:0.3s;padding:10px 0;}
.bottom-nav.lateral button.active{color:var(--primary-color);}

/* MODELO 3: MENU ALTO (Topo) */
.app-header.alto{background:rgba(0,0,0,0.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);display:flex;justify-content:space-around;padding:10px;z-index:100;position:sticky;top:0;}
.app-header.alto button{background:none;border:none;color:rgba(255,255,255,0.4);display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:600;cursor:pointer;transition:0.3s;}
.app-header.alto button.active{color:var(--primary-color);}
{{menu_style_end}}

/* =========================================================
   ESTILO DE CARD E PLAYER (Escolha do Gerador)
   ========================================================= */
{{card_style_start}}
/* MODELO A: CARDS QUADRADOS E PLAYER PADRÃO */
.card-padrao .ch-row{padding:12px;background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px;cursor:pointer;}
.card-padrao .poster{background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;overflow:hidden;}
.vjs-padrao .vjs-big-play-button{background:var(--primary-color);border-radius:50%;width:65px;height:65px;line-height:65px;margin-left:-32px;margin-top:-32px;}

/* MODELO B: CARDS ARREDONDADOS E PLAYER FLUTUANTE */
.card-fluido .ch-row{background:var(--glass);border-radius:30px;padding:10px 20px;box-shadow:var(--shadow);}
.card-fluido .poster{border-radius:30px;box-shadow:var(--shadow);}
.vjs-fluido .vjs-big-play-button{background:var(--primary-color);border-radius:20px;width:80px;height:60px;line-height:60px;margin-left:-40px;margin-top:-30px;}
{{card_style_end}}

.view{display:none;padding:15px;}
.view.active{display:block;}
.hero{position:relative;width:100%;aspect-ratio:16/9;border-radius:20px;overflow:hidden;margin-bottom:20px;background:linear-gradient(135deg,#1a0a28,var(--bg-app));}
.hero .overlay{position:absolute;bottom:20px;left:20px;font-size:1.5rem;font-weight:800;}
.hero .overlay span{color:var(--primary-color);}

/* Abas específicas */
#view-info{display:none;padding:15px;}
#view-info.active{display:block;}
</style>
</head>
<body>

<!-- Splash Screen -->
<div id="splash-screen">
    <div class="splash-logo">{{app_name}}</div>
    <div class="splash-loader"></div>
</div>

<!-- Login -->
<div class="login-screen" id="loginScreen">
    <div class="logo">{{app_name}}</div>
    <div class="login-card">
        <input id="inputServer" type="text" placeholder="URL do Servidor" value="{{server_url}}">
        <input id="inputUser" type="text" placeholder="Usuário" value="{{xtream_user}}">
        <input id="inputPass" type="password" placeholder="Senha" value="{{xtream_pass}}">
        <button onclick="doLogin()"><i class="bi bi-box-arrow-in-right me-2"></i>Conectar</button>
    </div>
</div>

<div id="app">
    <!-- MENU & HEADER (Injetado dinamicamente conforme a escolha) -->
    <div id="menu-container"></div>

    <!-- VIEWS -->
    <div id="view-home" class="view active"></div>
    <div id="view-live" class="view"></div>
    <div id="view-vod" class="view"></div>
    <div id="view-series" class="view"></div>
    <div id="view-favorites" class="view"></div>
    <div id="view-info" class="view"></div>
</div>

<div class="modal fade" id="playerModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content">
      <div class="modal-body p-0">
        <div style="aspect-ratio:16/9;background:#000;">
            <video id="videoEl" class="video-js" controls preload="auto" playsinline></video>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const $=(s)=>document.querySelector(s);
const $$=(s)=>[...document.querySelectorAll(s)];

/* CONFIGURAÇÕES DO GERADOR */
const MENU_STYLE = "{{menu_choice}}"; // baixo, lateral, alto
const CARD_STYLE = "{{card_choice}}"; // padrao, fluido
const PLAYER_STYLE = "{{player_choice}}"; // padrao, fluido

let SERVER, USER, PASS;

function doLogin() {
    SERVER = document.getElementById('inputServer').value.replace(/\/+$/, '');
    USER = document.getElementById('inputUser').value;
    PASS = document.getElementById('inputPass').value;

    if(!SERVER || !USER || !PASS) { alert("Preencha todos os dados!"); return; }
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('splash-screen').classList.remove('hide');
    
    setTimeout(() => {
        document.getElementById('splash-screen').classList.add('hide');
        document.getElementById('app').style.display = 'block';
        mountApp();
    }, 1500);
}

const api = {
    base() { return SERVER + '/player_api.php?username=' + USER + '&password=' + PASS; },
    async call(action='') {
        const r = await fetch(api.base() + (action ? '&action='+action : ''));
        return r.json();
    },
    streamLive(id) { return SERVER + '/live/' + USER + '/' + PASS + '/' + id + '.m3u8'; },
    streamVod(id) { return SERVER + '/movie/' + USER + '/' + PASS + '/' + id + '.mp4'; }
};

const cache = { live: null, vod: null, series: null, userInfo: null };

if(document.getElementById('inputServer').value) doLogin();

function mountApp() {
    // Define o menu
    let menuHTML = '';
    if(MENU_STYLE === 'baixo') {
        menuHTML = `
            <nav class="bottom-nav baixo">
                <button class="nav-item active" data-target="home"><i class="bi bi-house-heart-fill"></i><span>Início</span></button>
                <button class="nav-item" data-target="live"><i class="bi bi-broadcast"></i><span>Canais</span></button>
                <button class="nav-item" data-target="vod"><i class="bi bi-film"></i><span>Filmes</span></button>
                <button class="nav-item" data-target="series"><i class="bi bi-collection-play-fill"></i><span>Séries</span></button>
                <button class="nav-item" data-target="favorites"><i class="bi bi-heart-fill"></i><span>Favs</span></button>
                <button class="nav-item" data-target="info"><i class="bi bi-info-circle-fill"></i><span>Info</span></button>
            </nav>
        `;
    } else if(MENU_STYLE === 'lateral') {
        menuHTML = `
            <nav class="bottom-nav lateral">
                <button class="nav-item active" data-target="home"><i class="bi bi-house-heart-fill"></i><span>Início</span></button>
                <button class="nav-item" data-target="live"><i class="bi bi-broadcast"></i><span>Canais</span></button>
                <button class="nav-item" data-target="vod"><i class="bi bi-film"></i><span>Filmes</span></button>
                <button class="nav-item" data-target="series"><i class="bi bi-collection-play-fill"></i><span>Séries</span></button>
                <button class="nav-item" data-target="favorites"><i class="bi bi-heart-fill"></i><span>Favs</span></button>
                <button class="nav-item" data-target="info"><i class="bi bi-info-circle-fill"></i><span>Info</span></button>
            </nav>
        `;
    } else if(MENU_STYLE === 'alto') {
        menuHTML = `
            <header class="app-header alto">
                <h1 style="color:var(--primary-color);margin:0;">{{app_name}}</h1>
                <div style="display:flex;gap:10px;">
                    <button class="nav-item active" data-target="home">Início</button>
                    <button class="nav-item" data-target="live">Canais</button>
                    <button class="nav-item" data-target="vod">Filmes</button>
                    <button class="nav-item" data-target="series">Séries</button>
                    <button class="nav-item" data-target="info">Info</button>
                </div>
            </header>
        `;
    }
    document.getElementById('menu-container').innerHTML = menuHTML;

    // Define o estilo dos Cards e Player
    document.body.classList.add(CARD_STYLE === 'fluido' ? 'card-fluido' : 'card-padrao');
    document.getElementById('videoEl').classList.add(PLAYER_STYLE === 'fluido' ? 'vjs-fluido' : 'vjs-padrao');

    // Inicializa lógica
    renderHome();
    $$('.nav-item').forEach(b => {
        b.addEventListener('click', function() {
            $$('.nav-item').forEach(n => n.classList.remove('active'));
            $$('.view').forEach(v => v.classList.remove('active'));
            this.classList.add('active');
            document.getElementById('view-' + this.dataset.target).classList.add('active');
            if(this.dataset.target === 'live') renderLive();
            if(this.dataset.target === 'vod') renderVod();
            if(this.dataset.target === 'series') renderSeries();
            if(this.dataset.target === 'info') renderInfo();
        });
    });
}

/* ================= RENDERIZAÇÃO ================= */

function renderHome() {
    $('#view-home').innerHTML = `
        <div class="hero">
            <div class="overlay">Aproveite<br/><span>seu tempo</span></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div style="background:var(--glass);padding:20px;border-radius:14px;text-align:center;cursor:pointer;" onclick="navigateTo('live')">
                <i class="bi bi-broadcast" style="font-size:2rem;color:var(--primary-color);"></i><br>Canais
            </div>
            <div style="background:var(--glass);padding:20px;border-radius:14px;text-align:center;cursor:pointer;" onclick="navigateTo('vod')">
                <i class="bi bi-film" style="font-size:2rem;color:var(--primary-color);"></i><br>Filmes
            </div>
        </div>
    `;
}

async function renderLive() {
    const el = document.getElementById('view-live');
    el.innerHTML = '<p style="padding:20px;text-align:center;">Carregando canais...</p>';
    if(!cache.live) cache.live = await api.call('get_live_streams');
    if(!cache.live || !cache.live.length) {
        el.innerHTML = '<p style="padding:30px;text-align:center;opacity:0.6;">Nenhum canal encontrado.</p>';
        return;
    }
    let html = '';
    cache.live.slice(0, 50).forEach(s => {
        html += `
            <div class="ch-row" onclick="playLive('${s.stream_id}', '${s.name}')">
                <div class="ch-logo">${s.stream_icon ? `<img src="${s.stream_icon}" />` : '<i class="bi bi-tv"></i>'}</div>
                <div class="ch-info"><div class="ch-name">${s.name}</div></div>
            </div>
        `;
    });
    el.innerHTML = html;
}

async function renderVod() {
    const el = document.getElementById('view-vod');
    el.innerHTML = '<p style="padding:20px;text-align:center;">Carregando filmes...</p>';
    if(!cache.vod) cache.vod = await api.call('get_vod_streams');
    if(!cache.vod || !cache.vod.length) {
        el.innerHTML = '<p style="padding:30px;text-align:center;opacity:0.6;">Nenhum filme encontrado.</p>';
        return;
    }
    let html = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;">';
    cache.vod.slice(0, 30).forEach(s => {
        html += `
            <div class="poster" onclick="playVod('${s.stream_id}', '${s.name}')">
                <div class="img-wrap">${s.stream_icon ? `<img src="${s.stream_icon}" />` : ''}</div>
                <div class="title">${s.name}</div>
            </div>
        `;
    });
    html += '</div>';
    el.innerHTML = html;
}

async function renderSeries() {
    const el = document.getElementById('view-series');
    el.innerHTML = '<p style="padding:20px;text-align:center;">Carregando séries...</p>';
    if(!cache.series) cache.series = await api.call('get_series');
    if(!cache.series || !cache.series.length) {
        el.innerHTML = '<p style="padding:30px;text-align:center;opacity:0.6;">Nenhuma série encontrada.</p>';
        return;
    }
    let html = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;">';
    cache.series.slice(0, 30).forEach(s => {
        html += `
            <div class="poster">
                <div class="img-wrap">${s.cover ? `<img src="${s.cover}" />` : ''}</div>
                <div class="title">${s.name}</div>
            </div>
        `;
    });
    html += '</div>';
    el.innerHTML = html;
}

async function renderInfo() {
    if(!cache.userInfo) {
        try { cache.userInfo = await api.call(); } catch(e) { cache.userInfo = { user_info: { username: USER, exp_date: 0 } }; }
    }
    const info = cache.userInfo.user_info || { username: USER, exp_date: 0 };
    document.getElementById('view-info').innerHTML = `
        <h3 style="color:var(--primary-color);">Informações da Conta</h3>
        <div style="background:var(--glass);padding:15px;border-radius:14px;margin-top:15px;">
            <p><strong>Usuário:</strong> ${info.username}</p>
            <p><strong>Expiração:</strong> ${new Date(info.exp_date * 1000).toLocaleDateString()}</p>
            <p><strong>Servidor:</strong> ${SERVER}</p>
        </div>
    `;
}

/* ================= PLAYER ================= */
let player = null;
window.playLive = (id, name) => { play(api.streamLive(id), name); };
window.playVod = (id, name) => { play(api.streamVod(id), name); };
window.navigateTo = (target) => {
    const btn = document.querySelector(`.nav-item[data-target="${target}"]`);
    if(btn) btn.click();
};

function play(url, title) {
    if(player) { player.dispose(); player = null; }
    new bootstrap.Modal('#playerModal').show();
    setTimeout(() => {
        player = videojs('videoEl', { controls: true, autoplay: true, fluid: true });
        player.src({ src: url, type: 'application/x-mpegURL' });
    }, 300);
}
</script>
</body>
</html>

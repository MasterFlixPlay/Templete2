<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="{{bg_color}}" />
<title>{{app_name}}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/video.js@8.17.4/dist/video-js.min.css" />
<script src="https://cdn.jsdelivr.net/npm/video.js@8.17.4/dist/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<style>
:root {
  --primary-color: {{primary_color}};
  --primary-rgb: {{primary_rgb}};
  --bg-app: {{bg_color}};
  --glass: rgba(255,255,255,0.06);
  --glass-border: rgba(255,255,255,0.10);
  --shadow: 0 0 30px rgba({{primary_rgb}}, 0.3);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{background:var(--bg-app);color:#f5f5f5;min-height:100vh;overflow-x:hidden;}

/* LOGIN */
.login-screen{position:fixed;inset:0;z-index:9999;background:var(--bg-app);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.login-screen .logo{font-size:2.2rem;font-weight:800;color:var(--primary-color);text-shadow:var(--shadow);margin-bottom:30px;}
.login-card{width:100%;max-width:380px;background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;padding:25px;}
.login-card input{width:100%;padding:14px;background:rgba(0,0,0,0.4);border:1px solid var(--glass-border);border-radius:12px;color:#fff;margin-bottom:12px;outline:none;transition:0.3s;font-size:15px;}
.login-card input:focus{border-color:var(--primary-color);}
.login-card button{width:100%;padding:14px;background:var(--primary-color);border:none;border-radius:12px;color:#fff;font-weight:bold;font-size:1rem;cursor:pointer;transition:0.3s;box-shadow:var(--shadow);}
.login-card button:hover{transform:translateY(-2px);}

/* SPLASH */
#splash-screen{position:fixed;inset:0;z-index:10000;background:var(--bg-app);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.8s ease;}
#splash-screen.hide{opacity:0;pointer-events:none;}
.splash-logo{font-size:3rem;font-weight:800;color:var(--primary-color);text-shadow:var(--shadow);}
.splash-loader{margin-top:30px;width:40px;height:40px;border:4px solid rgba(255,255,255,0.1);border-top-color:var(--primary-color);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* APP */
#app{display:none;}

/* =========================================================
   ESTILOS DE MENU (Gerador escolhe)
   ========================================================= */
{{MENU_STYLES}}
{{MENU_START_1}}
.bottom-nav.baixo{position:fixed;bottom:0;width:100%;background:rgba(0,0,0,0.8);backdrop-filter:blur(20px);border-top:1px solid var(--glass-border);display:flex;justify-content:space-around;padding:10px 0;z-index:100;}
.bottom-nav.baixo button{background:none;border:none;color:rgba(255,255,255,0.4);display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:600;cursor:pointer;transition:0.3s;padding:5px;}
.bottom-nav.baixo button i{font-size:1.4rem;margin-bottom:2px;}
.bottom-nav.baixo button.active{color:var(--primary-color);}
{{MENU_END_1}}

{{MENU_START_2}}
.bottom-nav.lateral{position:fixed;left:0;top:0;width:85px;height:100vh;background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);border-right:1px solid var(--glass-border);display:flex;flex-direction:column;justify-content:center;gap:25px;padding:20px 0;z-index:100;}
.bottom-nav.lateral button{background:none;border:none;color:rgba(255,255,255,0.4);display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:600;cursor:pointer;transition:0.3s;padding:10px 0;}
.bottom-nav.lateral button i{font-size:1.5rem;margin-bottom:3px;}
.bottom-nav.lateral button.active{color:var(--primary-color);}
{{MENU_END_2}}

{{MENU_START_3}}
.app-header.alto{background:rgba(0,0,0,0.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);display:flex;justify-content:space-around;padding:10px;z-index:100;position:sticky;top:0;}
.app-header.alto button{background:none;border:none;color:rgba(255,255,255,0.4);display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:600;cursor:pointer;transition:0.3s;padding:5px;}
.app-header.alto button i{font-size:1.4rem;margin-bottom:2px;}
.app-header.alto button.active{color:var(--primary-color);}
{{MENU_END_3}}

/* =========================================================
   ESTILOS DE CARD (Gerador escolhe)
   ========================================================= */
{{CARD_STYLES}}
{{CARD_START_1}}
.card-padrao .ch-row{padding:12px;background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px;cursor:pointer;transition:0.2s;}
.card-padrao .ch-row:hover{border-color:var(--primary-color);}
.card-padrao .poster{background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;overflow:hidden;transition:0.2s;}
.card-padrao .poster:hover{border-color:var(--primary-color);}
{{CARD_END_1}}

{{CARD_START_2}}
.card-fluido .ch-row{background:var(--glass);border-radius:20px;padding:12px 18px;border:1px solid var(--glass-border);box-shadow:0 4px 15px rgba(0,0,0,0.2);margin-bottom:12px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:0.2s;}
.card-fluido .ch-row:hover{transform:translateY(-2px);}
.card-fluido .poster{border-radius:20px;overflow:hidden;border:1px solid var(--glass-border);transition:0.2s;}
.card-fluido .poster:hover{transform:scale(1.02);}
{{CARD_END_2}}

/* =========================================================
   COMPONENTES VISUAIS E LOGICAS
   ========================================================= */
.view{display:none;padding:15px;padding-bottom:90px;}
.view.active{display:block;}
.app-header-top{display:flex;align-items:center;justify-content:space-between;padding:15px;background:rgba(0,0,0,0.5);backdrop-filter:blur(10px);border-bottom:1px solid var(--glass-border);position:sticky;top:0;z-index:50;}
.app-header-top h1{font-size:1.2rem;font-weight:800;color:var(--primary-color);}

/* SLIDER DE DESTAQUE (PUXA FILMES E SÉRIES) */
#hero-carousel{width:100%;aspect-ratio:16/9;border-radius:20px;overflow:hidden;margin-bottom:15px;position:relative;background:var(--bg-app);}
.carousel-item{height:100%;width:100%;position:relative;}
.carousel-item img{width:100%;height:100%;object-fit:cover;}
.carousel-overlay{position:absolute;bottom:0;left:0;width:100%;padding:20px;background:linear-gradient(180deg,transparent,rgba(0,0,0,0.8));}
.carousel-overlay h5{font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,0.8);}
.carousel-control-prev,.carousel-control-next{filter:invert(1);}
.carousel-indicators [data-bs-target]{background-color:var(--primary-color);}

/* GRID E LISTAS */
.ch-logo{width:40px;height:40px;border-radius:10px;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ch-logo img{max-width:80%;max-height:80%;object-fit:contain;}
.ch-info{flex:1;}.ch-info .ch-name{font-weight:600;font-size:14px;}
.poster .img-wrap{aspect-ratio:2/3;background:rgba(0,0,0,0.3);border-radius:14px;overflow:hidden;}
.poster .img-wrap img{width:100%;height:100%;object-fit:cover;}
.poster .title{padding:10px;font-size:13px;font-weight:600;text-align:center;}
.poster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;}
.h-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:5px;scroll-snap-type:x mandatory;}
.h-scroll::-webkit-scrollbar{display:none;}
.h-scroll .poster{flex:0 0 auto;width:120px;scroll-snap-align:start;}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:15px 0 10px;}
.section-head h5{font-weight:600;color:var(--primary-color);margin:0;}

/* CHIPS DE CATEGORIA (ORGANIZADOS E FILTRÁVEIS) */
.cat-chip-wrapper{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;border-bottom:1px solid var(--glass-border);margin-bottom:15px;}
.cat-chip{display:inline-block;background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:0.2s;color:#fff;}
.cat-chip:hover,.cat-chip.active{background:var(--primary-color);color:#fff;border-color:var(--primary-color);}

/* PLAYER MODAL */
.player-wrap{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:16/9;box-shadow:0 0 40px rgba(255,255,255,.15);}
.player-wrap video{width:100%;height:100%;display:block;background:#000;}
.modal-content.player-modal{background:rgba(0,0,0,0.95);border:1px solid var(--glass-border);color:#fff;border-radius:22px;}
.player-actions .btn-ghost{background:transparent;color:#fff;border:1px solid var(--glass-border);border-radius:999px;padding:.45rem .8rem;font-weight:600;transition:all .2s;}
.player-actions .btn-ghost:hover{background:var(--glass);color:#fff}
</style>
</head>
<body>

<!-- Splash & Login -->
<div id="splash-screen"><div class="splash-logo">{{app_name}}</div><div class="splash-loader"></div></div>
<div class="login-screen" id="loginScreen">
    <div class="logo">{{app_name}}</div>
    <div class="login-card">
        <input id="inputServer" type="text" placeholder="URL do Servidor" value="{{server_url}}">
        <input id="inputUser" type="text" placeholder="Usuário" value="{{xtream_user}}">
        <input id="inputPass" type="password" placeholder="Senha" value="{{xtream_pass}}">
        <button onclick="doLogin()"><i class="bi bi-box-arrow-in-right me-2"></i>Conectar</button>
    </div>
</div>

<div id="app">
    <div id="menu-container"></div>
    <div id="view-home" class="view active"></div>
    <div id="view-live" class="view"></div>
    <div id="view-vod" class="view"></div>
    <div id="view-series" class="view"></div>
    <div id="view-favorites" class="view"></div>
    <div id="view-info" class="view"></div>
</div>

<!-- PLAYER MODAL (Mecânica Híbrida) -->
<div class="modal fade" id="playerModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content player-modal">
      <div class="modal-header border-0 pb-0">
        <div class="flex-grow-1 pe-2">
          <div class="player-title fw-bold" id="playerTitle">—</div>
          <div class="small text-muted-2" id="playerSubtitle">—</div>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body pt-2">
        <div class="player-wrap"><video id="videoEl" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video></div>
        <div class="player-actions d-flex gap-2 flex-wrap mt-3">
          <button class="btn-ghost" id="btnBack10"><i class="bi bi-arrow-counterclockwise me-1"></i>-10s</button>
          <button class="btn-ghost" id="btnFwd10"><i class="bi bi-arrow-clockwise me-1"></i>+10s</button>
          <button class="btn-ghost" id="btnPip"><i class="bi bi-pip me-1"></i>PiP</button>
          <button class="btn-ghost" id="btnFs"><i class="bi bi-arrows-fullscreen me-1"></i>Tela cheia</button>
          <button class="btn-ghost" id="btnFav"><i class="bi bi-heart me-1"></i>Favoritar</button>
        </div>
        <div id="playerExtra" class="mt-3 small text-muted-2"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL DE SÉRIES (Dropdown de Temporadas e Episódios) -->
<div class="modal fade" id="seriesModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content player-modal">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="seriesModalTitle">Séries</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="seriesModalBody">
        <div class="text-center p-3"><i class="bi bi-arrow-repeat me-2"></i>Carregando episódios...</div>
      </div>
    </div>
  </div>
</div>

<script>
const $=(s)=>document.querySelector(s);
const $$=(s)=>[...document.querySelectorAll(s)];

const MENU_STYLE = "{{menu_choice}}";
const CARD_STYLE = "{{card_choice}}";

let SERVER, USER, PASS;
let videojsPlayer=null, mpegtsInstance=null;
let currentHls = null;
const favorites = JSON.parse(localStorage.getItem('favs') || '[]');
const cache = { live: null, vod: null, series: null, userInfo: null, cats: { live: null, vod: null, series: null } };

/* =========================================================
   LOGIN E LOGOUT
   ========================================================= */
function performLogout() {
    if(confirm('Deseja realmente sair?')) {
        if(videojsPlayer) { videojsPlayer.dispose(); videojsPlayer = null; }
        if(currentHls) { currentHls.destroy(); currentHls = null; }
        if(mpegtsInstance) { mpegtsInstance.destroy(); mpegtsInstance = null; }
        localStorage.clear(); 
        // Limpa o cache do App
        cache.live = null; cache.vod = null; cache.series = null;
        cache.cats.live = null; cache.cats.vod = null; cache.cats.series = null;
        // Reseta visualmente o app e volta para o Login
        document.getElementById('app').style.display = 'none';
        document.getElementById('splash-screen').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('inputServer').value = '';
        document.getElementById('inputUser').value = '';
        document.getElementById('inputPass').value = '';
        // Fecha qualquer modal aberto
        const modals = document.querySelectorAll('.modal.show');
        modals.forEach(m => { const inst = bootstrap.Modal.getInstance(m); if(inst) inst.hide(); });
    }
}

function doLogin() {
    SERVER = document.getElementById('inputServer').value.replace(/\/+$/, '');
    USER = document.getElementById('inputUser').value;
    PASS = document.getElementById('inputPass').value;

    if(!SERVER || !USER || !PASS) { alert("Preencha todos os dados!"); return; }
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('splash-screen').style.display = 'flex';
    
    setTimeout(() => {
        document.getElementById('splash-screen').classList.add('hide');
        document.getElementById('app').style.display = 'block';
        setTimeout(() => {
            document.getElementById('splash-screen').style.display = 'none';
            mountApp();
        }, 500);
    }, 1000);
}

const api = {
    base() { return SERVER + '/player_api.php?username=' + USER + '&password=' + PASS; },
    async call(action='', extra='') {
        const r = await fetch(api.base() + (action ? '&action='+action : '') + (extra || ''));
        return r.json();
    },
    streamLive(id) { return SERVER + '/live/' + USER + '/' + PASS + '/' + id + '.m3u8'; },
    streamVod(id, ext='mp4') { return SERVER + '/movie/' + USER + '/' + PASS + '/' + id + '.' + ext; },
    streamEp(id, ext='mp4') { return SERVER + '/series/' + USER + '/' + PASS + '/' + id + '.' + ext; }
};

if(document.getElementById('inputServer').value) doLogin();

/* =========================================================
   MONTAGEM DO APP
   ========================================================= */
function mountApp() {
    let menuHTML = '';
    if(MENU_STYLE === 'baixo') {
        menuHTML = `<nav class="bottom-nav baixo">
            <button class="nav-item active" data-target="home"><i class="bi bi-house-heart-fill"></i><span>Início</span></button>
            <button class="nav-item" data-target="live"><i class="bi bi-broadcast"></i><span>Canais</span></button>
            <button class="nav-item" data-target="vod"><i class="bi bi-film"></i><span>Filmes</span></button>
            <button class="nav-item" data-target="series"><i class="bi bi-collection-play-fill"></i><span>Séries</span></button>
            <button class="nav-item" data-target="favorites"><i class="bi bi-heart-fill"></i><span>Favs</span></button>
            <button class="nav-item" data-target="info"><i class="bi bi-info-circle-fill"></i><span>Info</span></button>
        </nav>`;
    } else if(MENU_STYLE === 'lateral') {
        menuHTML = `<nav class="bottom-nav lateral">
            <button class="nav-item active" data-target="home"><i class="bi bi-house-heart-fill"></i><span>Início</span></button>
            <button class="nav-item" data-target="live"><i class="bi bi-broadcast"></i><span>Canais</span></button>
            <button class="nav-item" data-target="vod"><i class="bi bi-film"></i><span>Filmes</span></button>
            <button class="nav-item" data-target="series"><i class="bi bi-collection-play-fill"></i><span>Séries</span></button>
            <button class="nav-item" data-target="favorites"><i class="bi bi-heart-fill"></i><span>Favs</span></button>
            <button class="nav-item" data-target="info"><i class="bi bi-info-circle-fill"></i><span>Info</span></button>
        </nav>`;
    } else if(MENU_STYLE === 'alto') {
        menuHTML = `<header class="app-header alto">
            <div style="color:var(--primary-color);font-weight:bold;font-size:1.2rem;">{{app_name}}</div>
            <div style="display:flex;gap:10px;">
                <button class="nav-item active" data-target="home">Início</button>
                <button class="nav-item" data-target="live">Canais</button>
                <button class="nav-item" data-target="vod">Filmes</button>
                <button class="nav-item" data-target="series">Séries</button>
                <button class="nav-item" data-target="info">Info</button>
            </div>
        </header>`;
    }
    document.getElementById('menu-container').innerHTML = menuHTML;
    document.body.classList.add(CARD_STYLE === 'fluido' ? 'card-fluido' : 'card-padrao');

    // FORÇA A ABA HOME A SER A PRIMEIRA A CARREGAR
    document.querySelector('.nav-item[data-target="home"]')?.classList.add('active');
    document.getElementById('view-home').classList.add('active');
    renderHome();

    $$('.nav-item').forEach(b => {
        b.addEventListener('click', function() {
            $$('.nav-item').forEach(n => n.classList.remove('active'));
            $$('.view').forEach(v => v.classList.remove('active'));
            this.classList.add('active');
            const target = this.dataset.target;
            document.getElementById('view-' + target).classList.add('active');
            if(target === 'home') renderHome();
            if(target === 'live') renderLive();
            if(target === 'vod') renderVod();
            if(target === 'series') renderSeries();
            if(target === 'favorites') renderFavorites();
            if(target === 'info') renderInfo();
        });
    });
}

/* =========================================================
   TELA INICIAL (COM SLIDER RECUPERADO)
   ========================================================= */
async function renderHome() {
    const homeDiv = document.getElementById('view-home');
    homeDiv.innerHTML = `
        <div id="hero-carousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
            <div class="carousel-indicators" id="carousel-indicators"></div>
            <div class="carousel-inner" id="carousel-inner"></div>
            <button class="carousel-control-prev" type="button" data-bs-target="#hero-carousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#hero-carousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
        <div id="homeContent">
            <div style="text-align:center;padding:20px;opacity:0.7;">
                <i class="bi bi-arrow-repeat me-2"></i>Carregando vitrine...
            </div>
        </div>
    `;

    try {
        const [liveData, vodData, seriesData, liveCats, vodCats, seriesCats] = await Promise.all([
            !cache.live ? api.call('get_live_streams') : cache.live,
            !cache.vod ? api.call('get_vod_streams') : cache.vod,
            !cache.series ? api.call('get_series') : cache.series,
            !cache.cats.live ? api.call('get_live_categories') : cache.cats.live,
            !cache.cats.vod ? api.call('get_vod_categories') : cache.cats.vod,
            !cache.cats.series ? api.call('get_series_categories') : cache.cats.series
        ]);

        if(!cache.live) cache.live = liveData || [];
        if(!cache.vod) cache.vod = vodData || [];
        if(!cache.series) cache.series = seriesData || [];
        if(!cache.cats.live) cache.cats.live = liveCats || [];
        if(!cache.cats.vod) cache.cats.vod = vodCats || [];
        if(!cache.cats.series) cache.cats.series = seriesCats || [];

        const hasVod = cache.vod.length > 0;
        const hasSeries = cache.series.length > 0;

        // SLIDER MONTADO COM FILMES E SÉRIES
        let sliderItems = [];
        if(hasVod) cache.vod.slice(0, 5).forEach(s => sliderItems.push({img: s.stream_icon, title: s.name}));
        if(hasSeries) cache.series.slice(0, 5).forEach(s => sliderItems.push({img: s.cover, title: s.name}));

        const carouselInner = document.getElementById('carousel-inner');
        const carouselIndicators = document.getElementById('carousel-indicators');
        
        if(sliderItems.length > 0) {
            sliderItems.forEach((item, index) => {
                const isActive = index === 0 ? 'active' : '';
                const indicator = document.createElement('button');
                indicator.type = 'button';
                indicator.dataset.bsTarget = '#hero-carousel';
                indicator.dataset.bsSlideTo = index;
                if(isActive) indicator.classList.add('active');
                carouselIndicators.appendChild(indicator);

                const slide = document.createElement('div');
                slide.className = `carousel-item ${isActive}`;
                slide.innerHTML = `
                    <img src="${item.img || ''}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMzMzMiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1zaXplPSIyMCIgZmlsbD0iI2ZmZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI2ZmZiI+U2VtIEltYWdlbjwvdGV4dD48L3N2Zz4=';">

function toggleFav(type, id, name, cover) {

}

/* SISTEMA DE PLAYER MULTI-FORMATO (Baseado no Elas Merecem) */
function detectType(url, ext){
  const u=(url||'').toLowerCase().split('?')[0];
  const e=normalizeExt(ext);
  if(e==='m3u8'||e==='m3u'||u.endsWith('.m3u8')||u.endsWith('.m3u'))return 'hls';
  if(e==='ts'||e==='mts'||e==='m2ts'||e==='mpegts'||u.endsWith('.ts')||u.endsWith('.mts')||u.endsWith('.m2ts'))return 'mpegts';
  if(e==='mp4'||e==='m4v'||e==='mov'||u.endsWith('.mp4')||u.endsWith('.m4v')||u.endsWith('.mov'))return 'mp4';
  if(e==='mkv'||u.endsWith('.mkv'))return 'mkv';
  if(e==='webm'||u.endsWith('.webm'))return 'webm';
  return 'native';
}
function normalizeExt(ext){return (ext||'').toLowerCase().replace(/^\./,'')}
function replaceUrlExt(url,ext){
  const [base,query='']=(url||'').split('?');
  const next=base.match(/\.[^/.]+$/)?base.replace(/\.[^/.]+$/,'.'+ext):base+'.'+ext;
  return next+(query?'?'+query:'');
}
function sourceMime(type){
  if(type==='hls')return 'application/x-mpegURL';
  if(type==='mp4')return 'video/mp4';
  if(type==='webm')return 'video/webm';
  if(type==='mpegts')return 'video/mp2t';
  return '';
}
function buildSourceQueue(url,type,ext,kind){
  const queue=[];
  const add=(src,t)=>{if(src&&!queue.some(x=>x.src===src)){queue.push({src,type:t,mime:sourceMime(t)})}};
  add(url,type);
  const e=normalizeExt(ext);
  const fallbacks=kind==='live'?['m3u8','ts']:['mp4','mkv','ts','m3u8'];
  fallbacks.forEach(f=>{if(f!==e)add(replaceUrlExt(url,f),detectType(url,f))});
  return queue;
}
function resetVideoJs(){
  if(mpegtsInstance){try{mpegtsInstance.pause();mpegtsInstance.unload();mpegtsInstance.detachMediaElement();mpegtsInstance.destroy()}catch{}mpegtsInstance=null}
  if(videojsPlayer){try{videojsPlayer.pause();videojsPlayer.dispose()}catch{}videojsPlayer=null}
  const wrap=document.querySelector('#playerModal .player-wrap');
  if(wrap)wrap.innerHTML='<video id="videoEl" class="video-js vjs-big-play-centered" controls preload="auto" playsinline></video>';
}

function play(url, title) {
    if(videojsPlayer) { videojsPlayer.dispose(); videojsPlayer = null; }
    if(mpegtsInstance) { mpegtsInstance.destroy(); mpegtsInstance = null; }
    
    $('#playerTitle').textContent = title || 'Tocando';
    $('#playerSubtitle').textContent = '';
    $('#playerExtra').innerHTML = '';
    
    // Força o fechamento de qualquer outro modal e abre o player
    const modals = document.querySelectorAll('.modal.show');
    modals.forEach(m => { const inst = bootstrap.Modal.getInstance(m); if(inst && m.id !== 'playerModal') inst.hide(); });
    new bootstrap.Modal('#playerModal').show();
    resetVideoJs();

    const type = detectType(url, 'm3u8');
    const sources = buildSourceQueue(url, type, 'm3u8', 'live');
    let sourceIndex = 0;

    setTimeout(() => {
        const player = videojs('videoEl', {
            controls: true, autoplay: true, fluid: true, responsive: true, liveui: true,
            html5: { vhs: { overrideNative: false, enableLowInitialPlaylist: true } }
        });
        videojsPlayer = player;
        
        player.ready(() => {
            const mediaEl = player.tech({ IWillNotUseThisInPlugins: true }).el();
            const canMpegTs = () => window.mpegts && mpegts.getFeatureList && (mpegts.getFeatureList().msePlayback || mpegts.getFeatureList().mseLivePlayback);
            
            const tryNextSource = () => {
                if(mpegtsInstance) { mpegtsInstance.destroy(); mpegtsInstance = null; }
                const item = sources[sourceIndex] || { src: url, type: 'hls', mime: sourceMime('hls') };
                
                if (item.type === 'mpegts' && canMpegTs()) {
                    mpegtsInstance = mpegts.createPlayer({ type: 'mpegts', isLive: true, url: item.src }, { enableWorker: true, lazyLoad: false });
                    mpegtsInstance.attachMediaElement(mediaEl);
                    mpegtsInstance.load();
                    mpegtsInstance.play();
                } else {
                    player.src({ src: item.src, type: item.mime || 'application/x-mpegURL' });
                    player.load();
                    player.play().catch(() => {});
                }
            };
            
            player.on('error', () => {
                if (sourceIndex < sources.length - 1) { sourceIndex++; tryNextSource(); return; }
                // Fallback final: tenta o link original
                player.src({ src: url, type: 'application/x-mpegURL' });
                player.load();
            });
            tryNextSource();
        });
    }, 400);
}

   ========================================================= */
window.abrirSerie = (id) => {
    // Encontra a série no cache
    let s = cache.series.find(x => String(x.series_id) === String(id));
    if(!s) s = cache.series.find(x => String(x.stream_id) === String(id));
    if(!s) { alert('Série não encontrada'); return; }

    const modalTitle = document.getElementById('seriesModalTitle');
    const modalBody = document.getElementById('seriesModalBody');
    modalTitle.textContent = s.name || 'Série';
    modalBody.innerHTML = `<div class="text-center p-3"><i class="bi bi-arrow-repeat me-2"></i>Carregando episódios...</div>`;
    
    new bootstrap.Modal('#seriesModal').show();

    api('get_series_info', { series_id: s.series_id })
        .then(data => {
            if(!data || !data.episodes) {
                modalBody.innerHTML = `<div class="text-center p-3 text-muted">Nenhum episódio disponível.</div>`;
                return;
            }
            
            let seasons = [];
            let episodesMap = {};
            const epData = data.episodes;
            
            if(Array.isArray(epData)) {
                epData.forEach(ep => {
                    const seasonNum = ep.season || '1';
                    if(!episodesMap[seasonNum]) episodesMap[seasonNum] = [];
                    episodesMap[seasonNum].push(ep);
                });
                seasons = Object.keys(episodesMap).sort((a,b) => Number(a)-Number(b));
            } else {
                seasons = Object.keys(epData).sort((a,b) => Number(a)-Number(b));
                episodesMap = epData;
            }
            
            if(seasons.length === 0) {
                modalBody.innerHTML = `<div class="text-center p-3 text-muted">Nenhuma temporada disponível.</div>`;
                return;
            }
            
            let html = `
                <div class="d-flex gap-2 flex-wrap mb-3">
                    <select class="form-select" id="seasonSelect" style="max-width:200px;background:#1a1a1a;border:1px solid var(--glass-border);color:#fff;border-radius:10px;">
                        ${seasons.map(n => `<option value="${n}">Temporada ${n}</option>`).join('')}
                    </select>
                    <select class="form-select" id="episodeSelect" style="max-width:200px;background:#1a1a1a;border:1px solid var(--glass-border);color:#fff;border-radius:10px;"></select>
                </div>
                <button class="btn btn-primary w-100" id="watchEpisodeBtn" style="background:var(--primary-color);border:none;border-radius:10px;font-weight:bold;padding:10px;">▶ Assistir Episódio</button>
            `;
            modalBody.innerHTML = html;
            
            const fillEpisodes = () => {
                const n = document.getElementById('seasonSelect').value;
                const eps = episodesMap[n] || [];
                const epSel = document.getElementById('episodeSelect');
                epSel.innerHTML = eps.map((e, i) => 
                    `<option value="${i}">${e.episode_num || (i+1)} - ${e.title || 'Episódio'}</option>`
                ).join('');
            };
            
            fillEpisodes();
            document.getElementById('seasonSelect').onchange = fillEpisodes;
            
            document.getElementById('watchEpisodeBtn').onclick = () => {
                const n = document.getElementById('seasonSelect').value;
                const idx = Number(document.getElementById('episodeSelect').value);
                const e = episodesMap[n][idx];
                if(e) {
                    const ext = e.container_extension || 'mp4';
                    const url = api.streamEp(e.id, ext);
                    // Fecha o modal de séries e abre o player
                    bootstrap.Modal.getInstance('#seriesModal').hide();
                    play(url, `${s.name} - ${e.title || 'Episódio'}`);
                }
            };
        })
        .catch(err => {
            modalBody.innerHTML = `<div class="text-center p-3 text-danger">Erro: ${err.message}</div>`;
        });
};
